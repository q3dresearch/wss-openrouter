<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="968" viewBox="0 0 1000 968" role="img"><rect width="1000" height="968" fill="#ffffff"/><rect x="0.0" y="0.0" width="1000.0" height="968.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">Tokens are not money, even inside one client</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Every lab in OpenCode's latest 28 complete days (2026-09-28 to 2026-10-25). Across: its share of tokens. Up: its share of</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">what those tokens cost at input list price. The dashed line is parity: paid exactly in proportion to what it serves.</text><text x="40.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">DeepSeek serves 46% of the tokens and takes 66% of the spend. MiniMax serves 24% and takes 17%.</text><line x1="132.0" y1="758.0" x2="652.0" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="762.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">0%</text><line x1="132.0" y1="238.0" x2="132.0" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="132.0" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">0%</text><line x1="132.0" y1="687.3" x2="652.0" y2="687.3" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="691.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">10%</text><line x1="202.7" y1="238.0" x2="202.7" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="202.7" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">10%</text><line x1="132.0" y1="616.5" x2="652.0" y2="616.5" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="620.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">20%</text><line x1="273.5" y1="238.0" x2="273.5" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="273.5" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">20%</text><line x1="132.0" y1="545.8" x2="652.0" y2="545.8" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="549.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">30%</text><line x1="344.2" y1="238.0" x2="344.2" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="344.2" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">30%</text><line x1="132.0" y1="475.1" x2="652.0" y2="475.1" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="479.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">40%</text><line x1="414.9" y1="238.0" x2="414.9" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="414.9" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">40%</text><line x1="132.0" y1="404.3" x2="652.0" y2="404.3" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="408.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">50%</text><line x1="485.7" y1="238.0" x2="485.7" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="485.7" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">50%</text><line x1="132.0" y1="333.6" x2="652.0" y2="333.6" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="337.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">60%</text><line x1="556.4" y1="238.0" x2="556.4" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="556.4" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">60%</text><line x1="132.0" y1="262.9" x2="652.0" y2="262.9" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="266.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">70%</text><line x1="627.1" y1="238.0" x2="627.1" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="627.1" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">70%</text><text x="122.0" y="210.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="end" font-weight="600">share of SPEND</text><text x="122.0" y="226.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">tokens × input list price</text><text x="652.0" y="802.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="end" font-weight="600">share of TOKENS served</text><line x1="132.0" y1="758.0" x2="652.0" y2="238.0" stroke="#6b7684" stroke-width="1" stroke-opacity="1.0" stroke-dasharray="5 5"/><text x="516.8" y="363.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">paid in proportion to what you serve</text><text x="144.0" y="260.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal" font-style="italic">paid MORE than it serves</text><text x="640.0" y="746.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal" font-style="italic">serves MORE than it is paid</text><circle cx="460.6" cy="293.7" r="20.0" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="305.1" cy="635.7" r="15.9" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="260.6" cy="697.4" r="14.4" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="178.5" cy="727.4" r="10.6" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="153.4" cy="746.0" r="8.8" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="141.3" cy="740.5" r="7.5" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="487.6" y="297.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">DeepSeek  46% / 66%</text><text x="328.0" y="639.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">MiniMax  24% / 17%</text><text x="281.9" y="701.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Meta  18% / 9%</text><text x="196.1" y="731.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Xiaomi  7% / 4%</text><text x="169.2" y="765.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Zhipu  3% / 2%</text><circle cx="854.0" cy="248.0" r="7.0" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="868.0" y="252.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Chinese lab</text><circle cx="854.0" cy="272.0" r="7.0" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="868.0" y="276.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">everyone else</text><line x1="40.0" y1="820.0" x2="960.0" y2="820.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="40.0" y="846.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">DeepSeek is the only big lab above parity: it serves 46% of tokens and takes 66% of spend. The cheap models serve more than they are paid.</text><text x="40.0" y="870.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Input-token list price only, on the 97% of tokens that join to a price. Completion tokens cost more and are not counted; nobody large pays list.</text><text x="40.0" y="888.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">This is OpenCode's own traffic, not the market: one coding client, developer-skewed, and its own model mix.</text><text x="40.0" y="962.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: OpenCode Data (opencode.ai/data), 2026-09-28 to 2026-10-25; snapshot 2026-10-26T10:14:40.162Z.</text></svg>
