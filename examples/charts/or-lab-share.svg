" stroke-width="1" stroke-opacity="1.0"/><text x="34.0" y="722.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="600">The market grew 353× in 22 months. Anthropic served 1.1T in 2025-01 and 51.6T in 2026-10 — 47× more tokens — while its share fell from 49% to 7%.</text><text x="34.0" y="746.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Every sentence of the form “lab X is winning” has chosen a denominator. The absolute market grew, so a smaller share can still be more tokens than before.</text><text x="34.0" y="812.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: OpenRouter rankings, monthly totals; the current month is excluded as partial. as of 2026-11-08T10:34:47.917Z.</text></svg>
