#6b7684" text-anchor="start" font-weight="normal">36 models join the benchmark feed on model_permaslug, covering 58% of tokens. Intelligence index from Artificial Analysis; price is input list price.</text><text x="40.0" y="788.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">OpenRouter is a router: it sees everyone who routes through it and nobody who calls a lab directly. as of 2026-11-08T10:34:47.917Z.</text><text x="40.0" y="824.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Two DeepSeek V4.1 snapshots are plotted: the 2026-09-10 model is labelled at 16.9%; the 2026-10-17 model is the unlabelled 5.1% dot.</text></svg>
