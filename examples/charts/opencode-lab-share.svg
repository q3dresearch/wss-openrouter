-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="middle" font-weight="normal">01 Oct</text><text x="832.0" y="620.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="middle" font-weight="normal">25 Oct</text><line x1="34.0" y1="664.0" x2="1026.0" y2="664.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="34.0" y="684.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="600">DeepSeek went from 45% to 78% in eight weeks; Meta fell from 22% to 5%.</text><text x="34.0" y="704.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">OpenCode is one coding client, not the market. A lab share here is who that client's users route to, not who is winning.</text><text x="34.0" y="754.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: OpenCode Data (opencode.ai/data), snapshot 2026-10-26T10:14:40.162Z.</text></svg>
