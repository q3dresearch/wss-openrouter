<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1048" viewBox="0 0 1020 1048" role="img"><rect width="1020" height="1048" fill="#ffffff"/><rect x="0.0" y="0.0" width="1020.0" height="1048.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">Whoever picks the denominator picks the winner</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Every lab routed through OpenRouter in the latest 30 complete days (2026-09-26 to 2026-10-25). Across: its share of</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">tokens served. Up: its share of what those tokens cost at input list price. Both axes are shares of the same</text><text x="40.0" y="108.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">population on the same scale, so the dashed line is parity — paid exactly in proportion to what it serves.</text><text x="40.0" y="134.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">DeepSeek serves 41% of the tokens and takes 9% of the spend. OpenAI serves 12% and takes 51%.</text><line x1="132.0" y1="810.0" x2="692.0" y2="810.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="814.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">0%</text><line x1="132.0" y1="250.0" x2="132.0" y2="810.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="132.0" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">0%</text><line x1="132.0" y1="712.3" x2="692.0" y2="712.3" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="716.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">10%</text><line x1="229.7" y1="250.0" x2="229.7" y2="810.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="229.7" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">10%</text><line x1="132.0" y1="614.5" x2="692.0" y2="614.5" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="618.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">20%</text><line x1="327.5" y1="250.0" x2="327.5" y2="810.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="327.5" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">20%</text><line x1="132.0" y1="516.8" x2="692.0" y2="516.8" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="520.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">30%</text><line x1="425.2" y1="250.0" x2="425.2" y2="810.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="425.2" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">30%</text><line x1="132.0" y1="419.0" x2="692.0" y2="419.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="423.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">40%</text><line x1="523.0" y1="250.0" x2="523.0" y2="810.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="523.0" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">40%</text><line x1="132.0" y1="321.3" x2="692.0" y2="321.3" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="325.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">50%</text><line x1="620.7" y1="250.0" x2="620.7" y2="810.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="620.7" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">50%</text><text x="122.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="end" font-weight="600">share of SPEND</text><text x="122.0" y="238.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">tokens × input list price</text><text x="692.0" y="854.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="end" font-weight="600">share of TOKENS served</text><line x1="132.0" y1="810.0" x2="692.0" y2="250.0" stroke="#6b7684" stroke-width="1" stroke-opacity="1.0" stroke-dasharray="5 5"/><text x="546.4" y="385.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">paid in proportion to what you serve</text><text x="144.0" y="272.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal" font-style="italic">paid MORE than it serves</text><text x="680.0" y="798.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal" font-style="italic">serves MORE than it is paid</text><circle cx="537.1" cy="725.2" r="21.0" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="276.9" cy="765.8" r="14.6" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="249.5" cy="310.0" r="13.6" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="223.2" cy="796.1" r="12.6" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="219.2" cy="580.6" r="12.4" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="179.9" cy="771.7" r="10.5" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="161.3" cy="786.6" r="9.3" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="150.0" cy="777.9" r="8.4" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="145.2" cy="809.0" r="7.9" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="144.7" cy="807.9" r="7.8" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="135.7" cy="809.3" r="6.5" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="135.1" cy="804.6" r="6.4" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="270.1" y="314.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">OpenAI  12% / 51%</text><text x="565.1" y="729.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">DeepSeek  41% / 9%</text><text x="238.6" y="584.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Anthropic  9% / 23%</text><text x="298.5" y="769.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Z.ai  15% / 5%</text><text x="242.8" y="800.1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Xiaomi  9% / 1%</text><circle cx="864.0" cy="260.0" r="7.0" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="878.0" y="264.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Chinese lab</text><circle cx="864.0" cy="284.0" r="7.0" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="878.0" y="288.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">everyone else</text><line x1="40.0" y1="876.0" x2="980.0" y2="876.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="40.0" y="902.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Chinese labs serve 74% of the tokens and take 22% of the spend. The same month supports both 'winning' stories.</text><text x="40.0" y="926.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Input-token LIST price only — completion tokens cost several times more and are not counted, and nobody large pays list.</text><text x="40.0" y="944.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Covers the 67% of tokens that join to a price, keyed on model_permaslug. Labels omit labs below 5% of tokens; the marks are all there.</text><text x="40.0" y="962.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">This is spend routed through OpenRouter, not lab revenue: one router, developer-skewed.</text><text x="40.0" y="980.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Source: OpenRouter rankings and benchmark pricing, 2026-09-26 to 2026-10-25; as of 2026-10-26T10:14:40.162Z.</text></svg>
