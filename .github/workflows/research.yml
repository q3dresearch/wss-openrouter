# The long-view research figures need the publisher's archive, not just this
# repo's rolling captures. That makes them a monthly job rather than a weekly
# one: the archive is queried, never re-captured, and the cache is disposable.
#
# The weekly derive workflow renders examples/visualize.py from derived/.
# This workflow renders examples/research/ after fetching OpenRouter's archive
# and the OpenCode snapshots the publisher does not retain.
name: research

on:
  schedule:
    # Monthly, after the first weekly derive of the month (the first Tuesday
    # falls on the 1st through 7th). The archive is not perishable; a missed
    # run costs nothing, and the next one catches up.
    - cron: "20 3 8 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleet-commits
  cancel-in-progress: false

env:
  ENGINE_SPEC: "wss[object] @ git+https://github.com/${{ github.repository_owner }}/wss-engine.git@v0.6.58"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # data.py defaults to a sibling checkout. Keep the clone outside the repo
      # so it cannot be mistaken for tracked working material.
      HF_RAW: /tmp/wss-hugging-face/raw/hf.models.text-generation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install engine
        run: pip install "$ENGINE_SPEC"

      - name: Collect the Hugging Face raw captures
        # or-downloads-vs-use joins OpenRouter use to the weekly HF snapshots.
        # The repository is public, so the default token is enough; sparse
        # checkout keeps this to the one capture family the chart reads.
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            "https://github.com/${{ github.repository_owner }}/wss-hugging-face.git" \
            /tmp/wss-hugging-face
          git -C /tmp/wss-hugging-face sparse-checkout set raw/hf.models.text-generation

      - name: Fetch the publisher archives
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python examples/research/run.py --fetch

      - name: Render the research figures
        run: python examples/research/run.py

      - name: Refresh the dataset page
        run: wss datapage --repo-url "https://github.com/${{ github.repository }}"

      - name: Commit the refreshed figures (rebase-retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The research cache is gitignored: only the figures and the page
          # generated from them belong in the repository.
          git add -A examples/charts docs
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "research: run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $((i * 5))
            # `git pull --rebase` leaves a CONFLICTED TREE when it fails, so
            # attempts 2-5 fail for a different reason than attempt 1 and the
            # log reads as a push race. Abort so each attempt starts clean;
            # merge=union in .gitattributes handles the append-only manifest.
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "rebase conflict on attempt $i -- not a push race" >&2
            fi
          done
          echo "push failed after 5 attempts" >&2
          exit 1
