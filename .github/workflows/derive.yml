# Rebuilds derived/ from raw/ + manifest/.
#   scheduled / manual  → rebuild and commit the new observations
#   pull requests       → rebuild and FAIL unless byte-identical to what is
#                         committed (catches hand-edited CSVs and
#                         nondeterministic parsers; a parser PR must contain
#                         its rebuilt output)
#
# Parsers are auto-discovered from parsers/*.py, so adding a schema needs no
# workflow edit — same rule as adding a source.
name: derive

on:
  schedule:
    - cron: "20 0 * * 2" # after capture + health # after capture + health
  workflow_dispatch:
  pull_request:
    paths:
      - "parsers/**"
      - "raw/**"
      - "manifest/**"
      - "derived/**"
      - "registry/**"

permissions:
  contents: write

concurrency:
  group: fleet-commits
  cancel-in-progress: false

env:
  ENGINE_SPEC: "wss[object] @ git+https://github.com/${{ github.repository_owner }}/wss-engine.git@v0.6.58"

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install engine
        run: pip install "$ENGINE_SPEC"
      - name: Rebuild derived/ from the raw archive
        run: wss derive
      - name: Refresh the README charts
        id: charts
        # The charts are deterministic and read only derived/, so this belongs
        # in the same run that changes derived/. It runs before datapage: the
        # page copies examples/charts into docs/charts, and doing that first
        # published last week's figures under this week's dates.
        if: github.event_name != 'pull_request'
        continue-on-error: true # a chart failure must not block the data commit
        run: |
          python examples/visualize.py
          python examples/chart-maturity.py
      - name: Discard a partial chart render
        if: github.event_name != 'pull_request' && steps.charts.outcome == 'failure'
        run: |
          git checkout -- examples/charts
          git clean -fd examples/charts
      - name: Refresh the dataset page
        # Coverage dates come from the manifest, so the page goes stale the
        # moment a new capture lands. Regenerating it here is what makes the
        # "generated, never maintained" claim in its header true. Skipped on
        # pull requests, where the dates would move under the diff gate below.
        if: github.event_name != 'pull_request' && steps.charts.outcome == 'success'
        run: wss datapage --repo-url "https://github.com/${{ github.repository }}"
      - name: Byte-identical or red (pull requests)
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- derived
      - name: Commit new observations (scheduled/manual)
        # A chart failure is allowed to reach this step: the data is the thing
        # that cannot be re-fetched, so commit it and let the final gate go red.
        if: github.event_name != 'pull_request' && (success() || steps.charts.outcome == 'failure')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A derived docs examples/charts
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "derive: run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $((i * 5))
            # `git pull --rebase` leaves a CONFLICTED TREE when it fails, so
            # attempts 2-5 fail for a different reason than attempt 1 and the
            # log reads as a push race. Abort so each attempt starts clean;
            # merge=union in .gitattributes handles the append-only manifest.
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "rebase conflict on attempt $i -- not a push race" >&2
            fi
          done
          echo "push failed after 5 attempts" >&2
          exit 1
      - name: Red if the charts failed to render
        # The chart step is continue-on-error so the data commit above still
        # lands. This is the other half: a broken chart must not leave a green
        # run for the fleet sift to miss.
        if: github.event_name != 'pull_request' && steps.charts.outcome == 'failure'
        run: |
          echo "::error::chart render failed; data and docs were committed, but the figures are stale"
          exit 1
