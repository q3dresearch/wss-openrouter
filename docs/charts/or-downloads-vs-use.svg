font-weight="600">-0.10</text><text x="96.0" y="794.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">05 Sep</text><text x="246.7" y="794.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">15 Sep</text><text x="397.3" y="794.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">29 Sep</text><text x="548.0" y="794.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">13 Oct</text><text x="698.7" y="794.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">27 Oct</text><text x="774.0" y="794.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">03 Nov</text><text x="774.0" y="641.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7684" text-anchor="end" font-weight="normal">n = 12–15 models</text><line x1="40.0" y1="798.0" x2="1020.0" y2="798.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="40.0" y="822.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">Downloads do not predict use: the weekly rank correlation is negative in every window and ranges -0.37 to -0.05.</text><text x="40.0" y="844.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">SCOPE: this join can only see OPEN-WEIGHT models. A closed model has no Hugging Face presence, so Claude and the GPT-5 series are absent by construction.</text><text x="40.0" y="864.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">It says how open-weight popularity relates to open-weight use, not how the market works. 12 models is small; ranks are shown rather than a fitted line for that reason.</text><text x="40.0" y="932.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="start" font-weight="normal">Sources: OpenRouter rankings and models catalog; Hugging Face model index via wss-hugging-face. Latest capture 2026-11-03; OpenRouter as of 2026-11-08T10:34:47.917Z.</text></svg>
