boto,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7684" text-anchor="end" font-weight="normal">+0.5</text><line x1="96.0" y1="670.0" x2="774.0" y2="670.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="86.0" y="674.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7684" text-anchor="end" font-weight="normal">+1.0</text><polyline points="96.0,718.8 192.9,718.8 289.7,734.4 386.6,734.4 483.4,723.9 580.3,731.9 677.1,721.2 774.0,718.3" fill="none" stroke="#2a78d6" stroke-width="2.4" stroke-opacity="1.0" stroke-linejoin="round" stroke-linecap="round"/><circle cx="96.0" cy="718.8" r="4.0" fill="#2a78d6" fill-opacity="1.0" stroke="#ffffff" stroke-width="2"/><text x="96.0" y="733.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="middle" font-weight="600">-0.04</text><circle cx="192.9" cy="718.8" r="4.0" fill="#2a78d6" fill-opacity="1.0" stroke="#ffffff" stroke-width="2"/><circle cx="289.7" cy="734.4" r="4.0" fill="#2a78d6" fill-opacity="1.0" stroke="#ffffff" stroke-width="2"/><circle cx="386.6" cy="734.4" r="4.0" fill="#2a78d6" fill-opacity="1.0" stroke="#ffffff" stroke-width="2"/><circle cx="483.4" cy="723.9" r="4.0" fill="#2a78d6" fill-opacity="1.0" stroke="#ffffff" stroke-width="2"/><circle cx="580.3" cy="731.9" r="4.0" fill="#2a78d6" fill-opacity="1.0" stroke="#ffffff" stroke-width="2"/><circle cx="677.1" cy="721.2" r="4.0" fill="#2a78d6" fill-opacity="1.0" stroke="#ffffff" stroke-width="2"/><circle cx="774.0" cy="718.3" r="4.0" fill="#2a78d6" fill-opacity="1.0" stroke="#ffffff" stroke-width="2"/><text x="774.0" y="733.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1c2530" text-anchor="middle" font-weight="600">-0.03</text><text x="96.0" y="794.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">05 Sep</text><text x="289.7" y="794.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">15 Sep</text><text x="483.4" y="794.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">29 Sep</text><text x="677.1" y="794.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">13 Oct</text><text x="774.0" y="794.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">20 Oct</text><text x="774.0" y="641.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7684" text-anchor="end" font-weight="normal">n = 12–16 models</text><line x1="40.0" y1="798.0" x2="1020.0" y2="798.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="40.0" y="822.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">Downloads do not predict use: the weekly rank correlation is negative in every window and ranges -0.37 to -0.03.</text><text x="40.0" y="844.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">SCOPE: this join can only see OPEN-WEIGHT models. A closed model has no Hugging Face presence, so Claude and the GPT-5 series are absent by construction.</text><text x="40.0" y="864.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">It says how open-weight popularity relates to open-weight use, not how the market works. 14 models is small; ranks are shown rather than a fitted line for that reason.</text><text x="40.0" y="932.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="start" font-weight="normal">Sources: OpenRouter rankings and models catalog; Hugging Face model index via wss-hugging-face. Latest capture 2026-10-20; OpenRouter as of 2026-10-26T10:14:40.162Z.</text></svg>
