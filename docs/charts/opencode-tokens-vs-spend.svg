<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="968" viewBox="0 0 1000 968" role="img"><rect width="1000" height="968" fill="#ffffff"/><rect x="0.0" y="0.0" width="1000.0" height="968.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">Tokens are not money, even inside one client</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Every lab in OpenCode's latest 28 complete days (2026-10-06 to 2026-11-02). Across: its share of tokens. Up: its share of</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">what those tokens cost at input list price. The dashed line is parity: paid exactly in proportion to what it serves.</text><text x="40.0" y="115.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">DeepSeek serves 65% of the tokens and takes 88% of the spend. MiniMax serves 13% and takes 5%.</text><line x1="132.0" y1="758.0" x2="652.0" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="762.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">0%</text><line x1="132.0" y1="238.0" x2="132.0" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="132.0" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">0%</text><line x1="132.0" y1="705.0" x2="652.0" y2="705.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="709.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">10%</text><line x1="185.0" y1="238.0" x2="185.0" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="185.0" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">10%</text><line x1="132.0" y1="652.0" x2="652.0" y2="652.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="656.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">20%</text><line x1="238.0" y1="238.0" x2="238.0" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="238.0" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">20%</text><line x1="132.0" y1="599.0" x2="652.0" y2="599.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="603.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">30%</text><line x1="291.0" y1="238.0" x2="291.0" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="291.0" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">30%</text><line x1="132.0" y1="546.0" x2="652.0" y2="546.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="550.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">40%</text><line x1="344.0" y1="238.0" x2="344.0" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="344.0" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">40%</text><line x1="132.0" y1="493.0" x2="652.0" y2="493.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="497.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">50%</text><line x1="397.0" y1="238.0" x2="397.0" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="397.0" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">50%</text><line x1="132.0" y1="440.0" x2="652.0" y2="440.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="444.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">60%</text><line x1="450.0" y1="238.0" x2="450.0" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="450.0" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">60%</text><line x1="132.0" y1="387.0" x2="652.0" y2="387.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="391.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">70%</text><line x1="503.0" y1="238.0" x2="503.0" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="503.0" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">70%</text><line x1="132.0" y1="334.0" x2="652.0" y2="334.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="338.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">80%</text><line x1="556.0" y1="238.0" x2="556.0" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="556.0" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">80%</text><line x1="132.0" y1="281.0" x2="652.0" y2="281.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="285.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">90%</text><line x1="609.0" y1="238.0" x2="609.0" y2="758.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="609.0" y="778.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">90%</text><text x="122.0" y="210.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="end" font-weight="600">share of SPEND</text><text x="122.0" y="226.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">tokens × input list price</text><text x="652.0" y="802.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="end" font-weight="600">share of TOKENS served</text><line x1="132.0" y1="758.0" x2="652.0" y2="238.0" stroke="#6b7684" stroke-width="1" stroke-opacity="1.0" stroke-dasharray="5 5"/><text x="516.8" y="363.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">paid in proportion to what you serve</text><text x="144.0" y="260.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal" font-style="italic">paid MORE than it serves</text><text x="640.0" y="746.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal" font-style="italic">serves MORE than it is paid</text><circle cx="474.6" cy="293.7" r="20.0" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="200.8" cy="739.3" r="11.7" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="198.5" cy="730.9" r="11.6" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="160.7" cy="745.5" r="9.3" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="152.3" cy="751.4" r="8.7" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="135.2" cy="757.1" r="6.4" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="501.6" y="297.7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">DeepSeek  65% / 88%</text><text x="219.5" y="743.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Meta  13% / 4%</text><text x="217.1" y="719.9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">MiniMax  13% / 5%</text><text x="177.0" y="764.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Xiaomi  5% / 2%</text><text x="168.0" y="785.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Zhipu  4% / 1%</text><circle cx="854.0" cy="248.0" r="7.0" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="868.0" y="252.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Chinese lab</text><circle cx="854.0" cy="272.0" r="7.0" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="868.0" y="276.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">everyone else</text><line x1="40.0" y1="820.0" x2="960.0" y2="820.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="40.0" y="846.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">DeepSeek is the only big lab above parity: it serves 65% of tokens and takes 88% of spend. The cheap models serve more than they are paid.</text><text x="40.0" y="870.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Input-token list price only, on the 95% of tokens that join to a price. Completion tokens cost more and are not counted; nobody large pays list.</text><text x="40.0" y="888.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">This is OpenCode's own traffic, not the market: one coding client, developer-skewed, and its own model mix.</text><text x="40.0" y="962.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: OpenCode Data (opencode.ai/data), 2026-10-06 to 2026-11-02; snapshot 2026-11-08T10:34:47.917Z.</text></svg>
