<svg xmlns="http://www.w3.org/2000/svg" width="880" height="603" viewBox="0 0 880 603" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><rect width="880" height="603" fill="#fcfcfb"/>
<text x="28.0" y="40.0" font-size="19" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums">1 of 7 questions are answered now; 1 wait on the capture; 5 are not on a clock at all.</text>
<text x="28.0" y="60.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="font-variant-numeric: tabular-nums">Each question placed where the capture makes it answerable. Cadence is weekly; first capture 2026-09-01; 4 distinct capture days so far.</text>
<text x="28.0" y="88.0" font-size="8.5" fill="#8a8880" text-anchor="start" font-weight="700" letter-spacing="0.9" style="font-variant-numeric: tabular-nums">FOR</text>
