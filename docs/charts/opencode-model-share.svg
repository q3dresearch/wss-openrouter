eight="600">DeepSeek V4.1 Flash ends the window at 79% of tokens; MiniMax's spike peaked at 39% on a 7-day mean.</text><text x="34.0" y="600.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">A model can arrive, peak and fade inside eight weeks. That is a switching-cost finding, not a forecast of shelf life.</text><text x="34.0" y="654.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: OpenCode Data (opencode.ai/data), snapshot 2026-11-08T10:34:47.917Z.</text></svg>
