<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1048" viewBox="0 0 1020 1048" role="img"><rect width="1020" height="1048" fill="#ffffff"/><rect x="0.0" y="0.0" width="1020.0" height="1048.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="40.0" y="44.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">Whoever picks the denominator picks the winner</text><text x="40.0" y="70.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">Every lab routed through OpenRouter in the latest 30 complete days (2026-10-09 to 2026-11-07). Across: its share of</text><text x="40.0" y="89.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">tokens served. Up: its share of what those tokens cost at input list price. Both axes are shares of the same</text><text x="40.0" y="108.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#6b7684" text-anchor="start" font-weight="normal">population on the same scale, so the dashed line is parity — paid exactly in proportion to what it serves.</text><text x="40.0" y="134.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7684" text-anchor="start" font-weight="normal">DeepSeek serves 34% of the tokens and takes 4% of the spend. Anthropic serves 11% and takes 46%.</text><line x1="132.0" y1="810.0" x2="692.0" y2="810.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="814.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">0%</text><line x1="132.0" y1="250.0" x2="132.0" y2="810.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="132.0" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">0%</text><line x1="132.0" y1="701.5" x2="692.0" y2="701.5" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="705.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">10%</text><line x1="240.5" y1="250.0" x2="240.5" y2="810.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="240.5" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">10%</text><line x1="132.0" y1="593.0" x2="692.0" y2="593.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="597.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">20%</text><line x1="349.0" y1="250.0" x2="349.0" y2="810.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="349.0" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">20%</text><line x1="132.0" y1="484.5" x2="692.0" y2="484.5" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="488.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">30%</text><line x1="457.5" y1="250.0" x2="457.5" y2="810.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="457.5" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">30%</text><line x1="132.0" y1="376.0" x2="692.0" y2="376.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="380.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">40%</text><line x1="566.0" y1="250.0" x2="566.0" y2="810.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="566.0" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">40%</text><line x1="132.0" y1="267.5" x2="692.0" y2="267.5" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="122.0" y="271.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">50%</text><line x1="674.5" y1="250.0" x2="674.5" y2="810.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="674.5" y="830.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">50%</text><text x="122.0" y="222.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="end" font-weight="600">share of SPEND</text><text x="122.0" y="238.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="end" font-weight="normal">tokens × input list price</text><text x="692.0" y="854.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="end" font-weight="600">share of TOKENS served</text><line x1="132.0" y1="810.0" x2="692.0" y2="250.0" stroke="#6b7684" stroke-width="1" stroke-opacity="1.0" stroke-dasharray="5 5"/><text x="546.4" y="385.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="middle" font-weight="normal">paid in proportion to what you serve</text><text x="144.0" y="272.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal" font-style="italic">paid MORE than it serves</text><text x="680.0" y="798.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="end" font-weight="normal" font-style="italic">serves MORE than it is paid</text><circle cx="501.8" cy="764.3" r="21.0" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="308.4" cy="759.6" r="16.1" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="267.8" cy="650.6" r="14.7" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="252.4" cy="310.0" r="14.1" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="209.4" cy="706.4" r="12.3" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="203.1" cy="723.2" r="12.0" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="166.5" cy="802.6" r="9.9" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="164.7" cy="745.5" r="9.8" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="162.4" cy="763.9" r="9.6" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="153.8" cy="797.9" r="8.9" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="137.0" cy="808.6" r="6.9" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="136.9" cy="809.0" r="6.8" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><circle cx="133.7" cy="806.3" r="6.1" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="273.6" y="314.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Anthropic  11% / 46%</text><text x="529.8" y="768.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">DeepSeek  34% / 4%</text><text x="331.5" y="763.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Z.ai  16% / 5%</text><text x="289.5" y="654.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">OpenAI  13% / 15%</text><text x="228.7" y="710.4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Stepfun  7% / 10%</text><text x="222.1" y="727.2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Xiaomi  7% / 8%</text><text x="181.4" y="794.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#1c2530" text-anchor="start" font-weight="normal">Moonshot  3% / 6%</text><circle cx="864.0" cy="260.0" r="7.0" fill="#eb6834" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="878.0" y="264.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">Chinese lab</text><circle cx="864.0" cy="284.0" r="7.0" fill="#2a78d6" fill-opacity="1.0" stroke="none" stroke-width="1"/><text x="878.0" y="288.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7684" text-anchor="start" font-weight="normal">everyone else</text><line x1="40.0" y1="876.0" x2="980.0" y2="876.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="40.0" y="902.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#1c2530" text-anchor="start" font-weight="600">Chinese labs serve 73% of the tokens and take 34% of the spend. The same month supports both 'winning' stories.</text><text x="40.0" y="926.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Input-token LIST price only — completion tokens cost several times more and are not counted, and nobody large pays list.</text><text x="40.0" y="944.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Covers the 62% of tokens that join to a price, keyed on model_permaslug. Labels omit labs below 5% of tokens; the marks are all there.</text><text x="40.0" y="962.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">This is spend routed through OpenRouter, not lab revenue: one router, developer-skewed.</text><text x="40.0" y="980.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7684" text-anchor="start" font-weight="normal">Source: OpenRouter rankings and benchmark pricing, 2026-10-09 to 2026-11-07; as of 2026-11-08T10:34:47.917Z.</text></svg>
