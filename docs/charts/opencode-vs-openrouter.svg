I',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">08 Oct</text><text x="468.4" y="818.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">13 Oct</text><text x="589.9" y="818.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">18 Oct</text><text x="711.4" y="818.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">23 Oct</text><text x="760.0" y="818.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9" fill="#6b7684" text-anchor="middle" font-weight="normal">25 Oct</text><text x="760.0" y="651.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7684" text-anchor="end" font-weight="normal">models n=5–8 · labs n=6</text><line x1="618.0" y1="666.0" x2="638.0" y2="666.0" stroke="#2a78d6" stroke-width="2.2" stroke-opacity="1.0"/><text x="644.0" y="670.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#2a78d6" text-anchor="start" font-weight="600">models +0.19</text><line x1="704.0" y1="666.0" x2="724.0" y2="666.0" stroke="#eb6834" stroke-width="2.2" stroke-opacity="1.0" stroke-dasharray="5 4"/><text x="730.0" y="670.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#eb6834" text-anchor="start" font-weight="600">labs +0.09</text><line x1="34.0" y1="820.0" x2="1026.0" y2="820.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="34.0" y="844.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1c2530" text-anchor="start" font-weight="600">Router traffic and client traffic do not move together. The latest rank correlation is +0.19; the model-level rolling median is +0.10 and the sign changes.</text><text x="34.0" y="866.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Rank-weighted on purpose: each matched model counts once. Token-weighting would be dominated by DeepSeek, which is the thing being tested.</text><text x="34.0" y="884.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Dollar weights are unavailable because OpenCode publishes session cost, not per-model revenue. The lab line is a coarser cross-check, not a law.</text><text x="34.0" y="902.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Matched by hand across OpenCode slugs and OpenRouter permaslugs; 8 models. Free and paid variants of the same base model are aggregated.</text><text x="34.0" y="972.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="start" font-weight="normal">Sources: OpenRouter rankings, as of 2026-10-26T10:14:40.162Z; OpenCode Data (opencode.ai/data).</text></svg>
