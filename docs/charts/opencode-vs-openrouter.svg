<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="980" viewBox="0 0 1060 980" role="img"><rect width="1060" height="980" fill="#ffffff"/><rect x="0.0" y="0.0" width="1060.0" height="980.0" fill="#ffffff" fill-opacity="1.0" stroke="none" stroke-width="1" rx="0"/><text x="34.0" y="40.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#1c2530" text-anchor="start" font-weight="600">OpenRouter's traffic does not predict OpenCode's</text><text x="34.0" y="64.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">The same matched models by share of tokens. Axes are log scales; the diagonal is equal share. Above it, a model is bigger on OpenRouter than on OpenCode.</text><text x="34.0" y="82.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">Scatter: OpenRouter's latest 28 complete days (2026-09-28 to 2026-10-25) against OpenCode's latest 28 complete days (2026-09-28 to 2026-10-25).</text><text x="34.0" y="104.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b7684" text-anchor="start" font-weight="normal">Spearman rank correlation +0.19 across 8 matched models. The rolling panel asks whether that agreement is stable.</text><line x1="331.0" y1="222.0" x2="331.0" y2="552.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="331.0" y="572.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7684" text-anchor="middle" font-weight="normal">1.0%</text><line x1="104.0" y1="437.8" x2="760.0" y2="437.8" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="94.0" y="441.8" font-family="-apple-system,BlinkMacSystemFont,'Segoe