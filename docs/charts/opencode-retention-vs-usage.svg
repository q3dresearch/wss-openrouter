ill="#6b7684" text-anchor="middle" font-weight="normal">15 Oct</text><circle cx="960.0" cy="694.3" r="4.5" fill="#2a78d6" fill-opacity="1.0" stroke="#ffffff" stroke-width="1.5"/><text x="960.0" y="684.3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#1c2530" text-anchor="middle" font-weight="600">+0.43</text><text x="960.0" y="850.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="middle" font-weight="normal">26 Oct</text><line x1="34.0" y1="880.0" x2="1026.0" y2="880.0" stroke="#dfe4ea" stroke-width="1" stroke-opacity="1.0"/><text x="34.0" y="902.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1c2530" text-anchor="start" font-weight="600">The highest-retention model is not the most-used, and the most-used is not the stickiest. n=6; a correlation this small is not evidence.</text><text x="34.0" y="924.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">No promotional-discount field exists in OpenCode's feed. Effective price is session cost ÷ tokens per session: it includes cache and token mix, not a discount.</text><text x="34.0" y="944.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7684" text-anchor="start" font-weight="normal">Retention snapshots: 02 Oct, 15 Oct, 26 Oct; historical points are Internet Archive copies, not repo captures.</text><text x="34.0" y="1002.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="9.5" fill="#6b7684" text-anchor="start" font-weight="normal">Source: OpenCode Data (opencode.ai/data), snapshot 2026-10-26T09:28:49.000Z; historical snapshots: Internet Archive.</text></svg>
